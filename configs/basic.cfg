// Arma 3 dedicated server — basic.cfg
// Network bandwidth and performance tuning. Loaded via -cfg flag.

// Bandwidth limits in bps. Raise for more players.
MinBandwidth = 104857600;
MaxBandwidth = 536870912;
MaxMsgSend = 1024;
MaxSizeGuaranteed = 512;
MaxSizeNonguaranteed = 256;

MinErrorToSend = 0.001;
MinErrorToSendNear = 0.01;

MaxCustomFileSize = 1600000;

class Socket {
    gameProtocol = "UDP";
    queryProtocol = "UDP";
};

Windowed = 1;

// Timezone used for in-game date/time and weather.
serverLongitude = 0;
serverLatitude = 52;
serverLongitudeAuto = 0;
serverLatitudeAuto = 52;

language = "English";
adapter = -1;

terrainGrid = 25;
viewDistance = 1200;
