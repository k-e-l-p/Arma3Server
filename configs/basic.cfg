//
// Arma 3 Server - basic.cfg
// Network and performance configuration
//

// Bandwidth limits in bps. Adjust based on your connection and player count.
// Default: 500 Mbps upstream, 1024 Mbps downstream (effectively unlimited).
MinBandwidth = 104857600;           // 100 Mbps minimum
MaxBandwidth = 536870912;           // 512 Mbps maximum
MaxMsgSend = 1024;                  // Maximum number of messages per frame
MaxSizeGuaranteed = 512;            // Max guaranteed packet size in bytes (UDP)
MaxSizeNonguaranteed = 256;         // Max non-guaranteed packet size in bytes (UDP)

// Network smoothing / interpolation
MinErrorToSend = 0.001;             // Min error to send network update
MinErrorToSendNear = 0.01;          // Min error to send for nearby units

// Maximum size of custom packets (e.g. remote function calls)
MaxCustomFileSize = 0;              // 0 = unlimited, or set a byte limit

// Packet priorities and class bandwidths
class Socket {
    gameProtocol = "UDP";
    queryProtocol = "UDP";
};

// Windowed vs fullscreen (server should always be windowed)
Windowed = 1;

// Server FPS and simulation
// The ARMA_LIMITFPS env var overrides the frame rate at runtime.
// This setting controls the max "server FPS" for simulation.
serverLongitude = 0;
serverLatitude = 52;
serverLongitudeAuto = 0;
serverLatitudeAuto = 52;

// Language
language = "English";

// Adapter
adapter = -1;

// 3D Performance tuning (server doesn't render, keep low)
3D_Performance = 1.0;
Resolution_W = 640;
Resolution_H = 480;
Resolution_Bpp = 32;

// Multiplayer settings for large servers
MaxCustomFileSize = 1600000;

terrainGrid = 25;                   // Lower = more detailed, higher = better performance
viewDistance = 1200;                // Server view distance (client can still have higher)
